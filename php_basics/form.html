<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PHP User Form</title>
</head>

<body>

    <h1>User Information Form</h1>

    <form action="form_handler.php" method="POST">

        <label for="name">Name:</label>
        <br>

        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>


        <label for="email">Email:</label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>


        <label for="age">Age:</label>
        <br>

        <input
            type="number"
            id="age"
            name="age"
            min="1"
            max="100"
            required
        >

        <br><br>


        <button type="submit">
            Submit
        </button>

    </form>

</body>

</html>
